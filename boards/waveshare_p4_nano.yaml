# ESPD board definition — source of truth for components/espd_board_waveshare_p4_nano/
# Regenerated on every CMake configure (scripts/gen_board_plugins.py).

id: waveshare_p4_nano
name: Waveshare ESP32-P4-NANO
target: esp32p4
help: |
  Waveshare ESP32-P4-NANO (ES8311 codec, microSD). Onboard ESP32-C6-MINI provides
  Wi-Fi 6 / BLE over SDIO (ESP-Hosted). STA uses wifi_ssid= in config.txt (same
  as S3). BSP from ben-wes/esp-bsp (IDF 6); hosted Wi-Fi deps in esp32_p4_nano BSP.

bsp:
  component: esp32_p4_nano
  git: https://github.com/ben-wes/esp-bsp.git
  path: bsp/esp32_p4_nano
  version: waveshare-s3-p4

features:
  imply:
    - ESPD_USE_ADC
    - ESPD_USE_SDCARD
    - ESPD_USE_AIN
    - ESPD_USE_AOUT
    - ESPD_USE_WIFI
    - ESPD_USE_USB_OTG

profile:
  ESPD features:
    ESPD_USE_ADC: y
    ESPD_USE_SDCARD: y
    ESPD_USE_AIN: y
    ESPD_USE_AOUT: y
    ESPD_USE_WIFI: y
  Board hardware:
    BSP_CONFIG_NO_GRAPHIC_LIB: 1
    ESPTOOLPY_FLASHSIZE_16MB: y
    SPIRAM: y
    SPIRAM_MODE_HEX: y
    SPIRAM_SPEED_200M: y
    SPIRAM_BOOT_INIT: y
    SPIRAM_USE_MALLOC: y
    SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y
    SPIRAM_MALLOC_ALWAYSINTERNAL: 16384
    SPIRAM_MALLOC_RESERVE_INTERNAL: 65536
    SPIRAM_XIP_FROM_PSRAM: y
    CODEC_ES8311_SUPPORT: y
    BSP_SD_MOUNT_POINT: '"/sdcard"'
  ESP-Hosted (C6 SDIO):
    CONFIG_SLAVE_IDF_TARGET_ESP32C6: y
    CONFIG_ESP_HOSTED_CP_TARGET_ESP32C6: y
    CONFIG_ESP_HOSTED_P4_DEV_BOARD_FUNC_BOARD: y
    CONFIG_WIFI_RMT_STATIC_RX_BUFFER_NUM: 16
    CONFIG_WIFI_RMT_DYNAMIC_RX_BUFFER_NUM: 64
    CONFIG_WIFI_RMT_DYNAMIC_TX_BUFFER_NUM: 64
    CONFIG_WIFI_RMT_AMPDU_TX_ENABLED: y
    CONFIG_WIFI_RMT_TX_BA_WIN: 32
    CONFIG_WIFI_RMT_AMPDU_RX_ENABLED: y
    CONFIG_WIFI_RMT_RX_BA_WIN: 32
  Pd runtime tuning:
    ESP_MAIN_TASK_AFFINITY_CPU1: y
    ESP_MAIN_TASK_AFFINITY: "0x1"
    PTHREAD_TASK_STACK_SIZE_DEFAULT: 8192
    PTHREAD_TASK_PRIO_DEFAULT: 5
    PTHREAD_TASK_CORE_DEFAULT: 0
    LWIP_MAX_SOCKETS: 8
    LWIP_IPV6: y
    LWIP_TCP_SND_BUF_DEFAULT: 65534
    LWIP_TCP_WND_DEFAULT: 65534
    LWIP_TCP_RECVMBOX_SIZE: 64
    LWIP_UDP_RECVMBOX_SIZE: 64
    LWIP_TCPIP_RECVMBOX_SIZE: 64
    LWIP_TCP_SACK_OUT: y
    MBEDTLS_TLS_CLIENT_ONLY: y
    COMPILER_OPTIMIZATION_PERF: y
    COMPILER_OPTIMIZATION_ASSERTIONS_DISABLE: y
    COMPILER_OPTIMIZATION_ASSERTION_LEVEL: 0
    LOG_DEFAULT_LEVEL_INFO: y
    LOG_DEFAULT_LEVEL: 3
    LOG_MAXIMUM_LEVEL_INFO: y
    LOG_MAXIMUM_LEVEL: 3
    FREERTOS_IN_IRAM: y
  USB OTG:
    ESPD_USE_USB_OTG: y
    ESPD_USE_USB_MSC: y
    TINYUSB_MSC_ENABLED: y
    TINYUSB_MSC_BUFSIZE: 8192
    TINYUSB_CDC_ENABLED: y
    ESPD_USB_CONSOLE_CDC: y
    ESPD_DEV_CDC_SYNC: y
    ESPD_MSC_VOLUME_LABEL: '"ESPD"'
    ESP_CONSOLE_NONE: y
    WL_SECTOR_SIZE_512: y
