# ESPD board definition — source of truth for components/espd_board_waveshare_p4_nano/
# Regenerated on every CMake configure (scripts/gen_board_plugins.py).

id: waveshare_p4_nano
name: Waveshare ESP32-P4-NANO
target: esp32p4
help: |
  Waveshare ESP32-P4-NANO (ES8311 codec, microSD, optional DSI display).
  Official BSP from the Espressif Component Registry.

bsp:
  component: waveshare/esp32_p4_nano
  version: "^1.2.0"

features:
  imply:
    - ESPD_USE_ADC
    - ESPD_USE_SDCARD
    - ESPD_USE_AIN
    - ESPD_USE_AOUT
    - ESPD_USE_WIFI

profile:
  ESPD features:
    ESPD_USE_ADC: y
    ESPD_USE_SDCARD: y
    ESPD_USE_AIN: y
    ESPD_USE_AOUT: y
    ESPD_USE_WIFI: y
  Board hardware:
    ESPTOOLPY_FLASHSIZE_16MB: y
    SPIRAM: y
    SPIRAM_MODE_HEX: y
    SPIRAM_SPEED_200M: y
    SPIRAM_BOOT_INIT: y
    SPIRAM_USE_MALLOC: y
    SPIRAM_MALLOC_ALWAYSINTERNAL: 16384
    SPIRAM_MALLOC_RESERVE_INTERNAL: 65536
    CODEC_ES8311_SUPPORT: y
    BSP_SD_MOUNT_POINT: '"/sdcard"'
  Pd runtime tuning:
    ESP_MAIN_TASK_AFFINITY_CPU1: y
    ESP_MAIN_TASK_AFFINITY: "0x1"
    PTHREAD_TASK_STACK_SIZE_DEFAULT: 8192
    PTHREAD_TASK_PRIO_DEFAULT: 5
    PTHREAD_TASK_CORE_DEFAULT: 0
    LWIP_MAX_SOCKETS: 8
    LWIP_IPV6: y
    MBEDTLS_TLS_CLIENT_ONLY: y
    COMPILER_OPTIMIZATION_PERF: y
    COMPILER_OPTIMIZATION_ASSERTIONS_DISABLE: y
    COMPILER_OPTIMIZATION_ASSERTION_LEVEL: 0
    LOG_DEFAULT_LEVEL_WARN: y
    LOG_DEFAULT_LEVEL: 2
    LOG_MAXIMUM_LEVEL_INFO: y
    LOG_MAXIMUM_LEVEL: 3
    ESP_CONSOLE_UART_DEFAULT: y
    ESP_CONSOLE_UART: y
    ESP_CONSOLE_UART_NUM: 0
    FREERTOS_IN_IRAM: y
