version: "0.1.0"
description: Conditional esp-bsp package selector for ESPD boards

dependencies:
  idf: ">=6.0.1,<6.1"

  waveshare_esp32_s3_audio:
    git: https://github.com/r1ckp0/esp-bsp.git
    path: bsp/waveshare_esp32_s3_audio
    version: waveshare-bsp
    public: true
    matches:
      - if: $CONFIG{ESPD_BOARD_WAVESHARE_S3} == True
