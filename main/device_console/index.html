<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ESPD</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, sans-serif;
      --log-bg: #0c0c0c;
      --log-fg: #d4d4d4;
      --dock-bg: rgba(18, 18, 18, 0.88);
      --dock-border: rgba(255, 255, 255, 0.1);
      --accent: #3dd68c;
      --sync: #5eb3ff;
      --muted: #888;
      --dock-top: 3.25rem;
      --dock-bottom: 7.5rem;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--log-bg);
      color: var(--log-fg);
      overflow: hidden;
    }

    /* Full-viewport scrollable monitor */
    #log {
      position: fixed;
      inset: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding:
        calc(var(--dock-top) + env(safe-area-inset-top, 0px))
        max(0.75rem, env(safe-area-inset-right, 0px))
        calc(var(--dock-bottom) + env(safe-area-inset-bottom, 0px))
        max(0.75rem, env(safe-area-inset-left, 0px));
      font: 0.8rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #log .dev { color: var(--accent); }
    #log .sync { color: var(--sync); }

    /* Floating docks */
    .dock {
      position: fixed;
      left: 0;
      right: 0;
      z-index: 10;
      background: var(--dock-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-color: var(--dock-border);
      border-style: solid;
      padding-left: max(0.75rem, env(safe-area-inset-left, 0px));
      padding-right: max(0.75rem, env(safe-area-inset-right, 0px));
    }
    .dock-top {
      top: 0;
      border-bottom-width: 1px;
      padding-top: max(0.5rem, env(safe-area-inset-top, 0px));
      padding-bottom: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.75rem;
    }
    .dock-bottom {
      bottom: 0;
      border-top-width: 1px;
      padding-top: 0.6rem;
      padding-bottom: max(0.6rem, env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .brand {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fff;
      margin-right: 0.25rem;
    }
    #status {
      flex: 1 1 8rem;
      min-width: 0;
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }
    .row-grow { flex: 1 1 auto; min-width: 0; }

    button, label.btn {
      border: 1px solid var(--dock-border);
      background: rgba(255, 255, 255, 0.06);
      color: #eee;
      padding: 0.45rem 0.7rem;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover:not(:disabled), label.btn:hover {
      border-color: rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.1);
    }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    #pd-form {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }
    #pd-input {
      flex: 1 1 10rem;
      min-width: 0;
      border: 1px solid var(--dock-border);
      background: rgba(0, 0, 0, 0.35);
      color: #eee;
      padding: 0.5rem 0.65rem;
      border-radius: 4px;
      font: 0.75rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    #pd-input::placeholder { color: #666; }
    #pd-input:focus {
      outline: none;
      border-color: rgba(61, 214, 140, 0.5);
    }

    .sync-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.75rem;
      align-items: center;
      padding-top: 0.15rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .sync-panel label {
      font-size: 0.68rem;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
    }
    .hint {
      font-size: 0.65rem;
      color: var(--muted);
      margin: 0;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #folder-name { color: #aaa; }
    #watch-hint { color: var(--accent); }

    @media (max-width: 480px) {
      :root { --dock-bottom: 9.5rem; }
      .dock-top .brand { display: none; }
    }
  </style>
</head>
<body>
  <div id="log" aria-live="polite"></div>

  <div class="dock dock-top">
    <span class="brand">ESPD</span>
    <p id="status">Not connected</p>
    <div class="row">
      <button type="button" id="connect-btn">Connect</button>
      <button type="button" id="disconnect-btn" disabled>Disconnect</button>
    </div>
  </div>

  <div class="dock dock-bottom">
    <form id="pd-form">
      <input id="pd-input" maxlength="220" placeholder="Pd message…" disabled autocomplete="off" spellcheck="false" />
      <button type="submit" id="pd-btn" disabled>Send</button>
      <button type="button" id="reload-btn" disabled>Reload</button>
      <button type="button" id="reset-btn" disabled>Reset</button>
    </form>
    <div class="sync-panel">
      <button type="button" id="folder-btn">Folder &amp; sync</button>
      <button type="button" id="sync-btn" disabled>Sync now</button>
      <label><input type="checkbox" id="mirror-cb" checked /> Mirror</label>
      <span id="folder-name" class="hint"></span>
      <span id="watch-hint" class="hint"></span>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
