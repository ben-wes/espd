name: Build Waveshare firmware

on:
  push:
    branches:
      - waveshare
      - feature/ci
    tags:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply required Pd patches
        run: ./scripts/apply-pd-patches.sh

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          command: >-
            idf.py set-target esp32s3 &&
            printf '%s\n' 'CONFIG_ESPD_BOARD_WAVESHARE_S3=y' 'CONFIG_ESPD_BSP_COMPONENT_NAME="bsp_waveshare_s3"' >> sdkconfig &&
            idf.py build

      - name: Upload firmware as action artifact
        uses: actions/upload-artifact@v4
        with:
          name: espd-waveshare-${{ github.sha }}
          path: |
            build/espd.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args

      - name: Upload firmware to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/espd.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flash_args
